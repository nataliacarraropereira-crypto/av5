[project]
name = "av5"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Manuela Carraro Pereira", email = "manuelacarraropereira@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
]

[project.scripts]
av5 = "av5:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "sqlalchemy_uv/01_basico",
]
